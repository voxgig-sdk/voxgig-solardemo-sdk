name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  sdk-generate:
    name: Generate and check for drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'

      - name: Install dependencies
        working-directory: .sdk
        run: npm install

      - name: Build
        working-directory: .sdk
        run: npm run build

      # The seneca-provider target generates into ANOTHER repo, at a path
      # relative to this one's root (see model/sdk.aontu). In Actions that
      # resolves to /home/runner/work/seneca/solardemo-provider, which is
      # writable — but only because the parent happens to exist. Created
      # explicitly so a generate failure here means a real generator problem
      # rather than a missing directory.
      - name: Prepare the external provider output path
        run: mkdir -p ../../seneca/solardemo-provider

      - name: Generate
        working-directory: .sdk
        run: npm run generate

      # THE GOLDEN RULE, enforced: ts/ and go/ are generated output, so a
      # clean checkout plus `generate` must reproduce them exactly. Until now
      # nothing checked, and a hand-edit to generated source merged unnoticed
      # and was silently reverted by the next regeneration.
      - name: Fail if generated output drifted
        run: |
          if ! git diff --exit-code; then
            echo "::error::Generated output does not match the model."
            echo "Someone hand-edited ts/ or go/, or changed .sdk/ without regenerating."
            echo "Fix: cd .sdk && npm run generate, then commit the result."
            exit 1
          fi
          # --exit-code ignores untracked files; a new generated file is drift too.
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo "::error::Generate produced untracked files:"
            git status --porcelain --untracked-files=all
            exit 1
          fi

  app-build-test:
    name: App build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'

      - name: Install dependencies
        working-directory: app
        run: npm install

      - name: Typecheck
        working-directory: app
        run: npm run typecheck

      - name: Test (unit + integration)
        working-directory: app
        run: npm test

      # `app/` is not an SDK, but it IS the only implementation the live SDK
      # tests can reach — so its contract is this repo's contract. Leaving it
      # untested is how the create-id defect (C1) survived: validate.ts was
      # red at 15/20 and nothing reported it.
      # stdout/stderr are redirected deliberately: a background process that
      # inherits the step's stdout can keep the pipe open and hang the step
      # after the script itself has finished.
      - name: Start the server
        working-directory: app
        run: |
          npm run build
          node dist/src/server.js > "$RUNNER_TEMP/server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/app.pid"

      # Poll rather than `sleep 3` (which validate:full does, and which races
      # on a slow runner: EADDRINUSE or a connection refused mid-suite).
      - name: Wait for the server to accept connections
        run: |
          for i in $(seq 1 30); do
            if curl -sf --max-time 2 http://localhost:8901/api/planet >/dev/null; then
              echo "server ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::server did not become ready within 30s"
          cat "$RUNNER_TEMP/server.log" || true
          exit 1

      - name: Validate against the running server
        working-directory: app
        run: npx tsx validate.ts

      - name: Server log
        if: failure()
        run: cat "$RUNNER_TEMP/server.log" || true

      - name: Stop the server
        if: always()
        run: kill "$(cat "$RUNNER_TEMP/app.pid")" 2>/dev/null || true

  ts-build-test:
    name: TypeScript build and test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['24', 'latest']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        working-directory: ts
        run: npm install

      - name: Build src
        working-directory: ts
        run: npx tsc --build src

      - name: Build test
        working-directory: ts
        run: npx tsc --build test

      - name: Verify test build output exists
        working-directory: ts
        run: ls dist-test/**/*.test.js

      - name: Remove .env.local if present
        working-directory: ts
        run: rm -f .env.local

      - name: Test (offline)
        working-directory: ts
        run: npm test

  go-build-test:
    name: Go build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          # Read the version from go.mod rather than pinning it here. The pin
          # said 1.20 while go.mod requires 1.23, so CI could never build:
          # feature/log_feature.go imports log/slog, which landed in 1.21.
          go-version-file: go/go.mod
          cache: false

      - name: Build
        working-directory: go
        run: go build ./...

      - name: Remove .env.local if present
        working-directory: go
        run: rm -f .env.local test/.env.local

      - name: Test (offline)
        working-directory: go
        run: go test ./... -v
