name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  sdk-generate:
    name: Generate and check for drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'

      - name: Install dependencies
        working-directory: .sdk
        run: npm install

      - name: Build
        working-directory: .sdk
        run: npm run build

      - name: Generate
        working-directory: .sdk
        run: npm run generate

      # The seneca-provider target generates into ANOTHER repo, at a path
      # relative to this one's root (see model/sdk-base.aontu). It is
      # `active: false` in model/sdk.aontu precisely so that never happens on
      # a checkout that is not laid out like a developer workstation — and
      # sdkgen CREATES a missing destination rather than refusing it, so
      # nothing else would notice.
      #
      # This job used to `mkdir -p ../../seneca/solardemo-provider` before
      # generating, which made the write succeed instead of preventing it.
      # Assert the absence instead: if `active: true` is ever committed, CI
      # goes red here rather than quietly publishing a provider repo into
      # /home/runner/work/.
      - name: Fail if generation escaped the repository
        run: |
          if [ -e ../../seneca ]; then
            echo "::error::Generation wrote outside the repository:"
            find ../../seneca -maxdepth 2 | head -20
            echo "The seneca-provider target must stay inactive in model/sdk.aontu."
            echo "To generate it deliberately: cd .sdk && npm run generate-provider"
            exit 1
          fi

      # THE GOLDEN RULE, enforced: ts/ and go/ are generated output, so a
      # clean checkout plus `generate` must reproduce them exactly. Until now
      # nothing checked, and a hand-edit to generated source merged unnoticed
      # and was silently reverted by the next regeneration.
      - name: Fail if generated output drifted
        run: |
          if ! git diff --exit-code; then
            echo "::error::Generated output does not match the model."
            echo "Someone hand-edited ts/ or go/, or changed .sdk/ without regenerating."
            echo "Fix: cd .sdk && npm run generate, then commit the result."
            exit 1
          fi
          # --exit-code ignores untracked files; a new generated file is drift too.
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo "::error::Generate produced untracked files:"
            git status --porcelain --untracked-files=all
            exit 1
          fi

  app-build-test:
    name: App build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'

      - name: Install dependencies
        working-directory: app
        run: npm install

      - name: Typecheck
        working-directory: app
        run: npm run typecheck

      - name: Test (unit + integration)
        working-directory: app
        run: npm test

      # `app/` is not an SDK, but it IS the only implementation the live SDK
      # tests can reach — so its contract is this repo's contract. Leaving it
      # untested is how the create-id defect (C1) survived: validate.ts was
      # red at 15/20 and nothing reported it.
      # stdout/stderr are redirected deliberately: a background process that
      # inherits the step's stdout can keep the pipe open and hang the step
      # after the script itself has finished.
      - name: Start the server
        working-directory: app
        run: |
          npm run build
          node dist/src/server.js > "$RUNNER_TEMP/server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/app.pid"

      # Poll rather than sleeping a fixed interval and hoping (which races
      # on a slow runner: EADDRINUSE or a connection refused mid-suite).
      - name: Wait for the server to accept connections
        run: |
          for i in $(seq 1 30); do
            if curl -sf --max-time 2 http://localhost:8901/api/planet >/dev/null; then
              echo "server ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::server did not become ready within 30s"
          cat "$RUNNER_TEMP/server.log" || true
          exit 1

      - name: Validate against the running server
        working-directory: app
        run: npx tsx validate.ts

      - name: Server log
        if: failure()
        run: cat "$RUNNER_TEMP/server.log" || true

      - name: Stop the server
        if: always()
        run: kill "$(cat "$RUNNER_TEMP/app.pid")" 2>/dev/null || true

  ts-build-test:
    name: TypeScript build and test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['24', 'latest']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        working-directory: ts
        run: npm install

      - name: Build src
        working-directory: ts
        run: npx tsc --build src

      - name: Build test
        working-directory: ts
        run: npx tsc --build test

      - name: Verify test build output exists
        working-directory: ts
        run: ls dist-test/**/*.test.js

      - name: Remove .env.local if present
        working-directory: ts
        run: rm -f .env.local

      - name: Test (offline)
        working-directory: ts
        run: npm test

  go-build-test:
    name: Go build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          # Read the version from go.mod rather than pinning it here. The pin
          # said 1.20 while go.mod requires 1.23, so CI could never build:
          # feature/log_feature.go imports log/slog, which landed in 1.21.
          go-version-file: go/go.mod
          cache: false

      - name: Build
        working-directory: go
        run: go build ./...

      - name: Remove .env.local if present
        working-directory: go
        run: rm -f .env.local test/.env.local

      - name: Test (offline)
        working-directory: go
        run: go test ./... -v

      # Coverage needs -coverpkg here, and reporting it is the point.
      #
      # Every Go test lives in go/test as one EXTERNAL `package sdktest`, so
      # Go's default per-package attribution credits core/entity/feature/
      # utility with 0.0% each — which is what the review recorded as "no
      # tests" (L7). They ARE exercised, from outside. Printing the real number
      # means a genuine drop becomes visible instead of being masked forever by
      # a zero nobody trusts.
      #
      # Reported, not gated: a hard floor would break CI on an honest refactor,
      # and the value here is that the number stops being invisible.
      - name: Coverage (whole module)
        working-directory: go
        run: |
          OUT=$(go test ./test/ -coverpkg=./... -cover -count=1 2>&1)
          echo "$OUT"
          PCT=$(echo "$OUT" | grep -oE 'coverage: [0-9.]+%' | head -1)
          {
            echo "### Go coverage"
            echo
            echo "${PCT:-coverage unavailable} of statements across ./..."
            echo
            echo "Measured with -coverpkg: the suite is an external"
            echo "\`package sdktest\`, so per-package coverage reads 0.0%."
          } >> "$GITHUB_STEP_SUMMARY"

  # The payoff of H1. Until live runs asserted, a green live suite proved
  # only that dispatch worked — a non-2xx was a bare `return` in TS and a
  # t.Skipf in Go, so the suite passed with nothing listening on the port.
  # Now both SDKs are run against the real companion server, which is the
  # only implementation of this API that exists.
  #
  # Measured, both directions, before this job was added:
  #
  #                      server up        server down
  #   ts   live          185 pass/1 skip  3 suites FAIL
  #   go   live          ok               3 suites FAIL
  #
  #   (MoonDirect, MoonEntity, PlanetDirect in both languages.)
  live-sdk:
    name: Live SDK against the companion server
    runs-on: ubuntu-latest
    env:
      SOLARDEMO_TEST_LIVE: 'TRUE'
      # Without a real id the nested moon tests skip rather than run: they
      # cannot invent a parent planet_id, and synthetic ids 4xx. 'earth' is
      # seeded in app/solar.data.json. Supplying it takes the live signal
      # from ONE failing suite to three — the planet tests self-discover an
      # id by listing first, the moon tests cannot.
      SOLARDEMO_TEST_MOON_ENTID: '{"planet01":"earth"}'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go/go.mod
          cache: false

      - name: Install and build the companion server
        working-directory: app
        run: |
          npm install
          npm run build

      - name: Start the server
        working-directory: app
        run: |
          node dist/src/server.js > "$RUNNER_TEMP/server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/app.pid"

      - name: Wait for the server to accept connections
        run: |
          for i in $(seq 1 30); do
            if curl -sf --max-time 2 http://localhost:8901/api/planet >/dev/null; then
              echo "server ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::server did not become ready within 30s"
          cat "$RUNNER_TEMP/server.log" || true
          exit 1

      - name: Build the TypeScript SDK
        working-directory: ts
        run: |
          npm install
          npx tsc --build src
          npx tsc --build test

      # .env.local would override the base URL and point the suite somewhere
      # other than the server just started. The offline jobs strip it too.
      - name: Remove .env.local if present
        run: rm -f ts/.env.local go/.env.local go/test/.env.local

      - name: TypeScript SDK (live)
        working-directory: ts
        run: npm test

      # -count=1 is REQUIRED, not tidiness: go test caches by input, and a
      # cached `ok` from an earlier offline run reports success without
      # contacting the server at all. Reproduced while building this job —
      # the first negative control passed purely from cache.
      - name: Go SDK (live)
        working-directory: go
        run: go test -count=1 ./...

      - name: Server log
        if: failure()
        run: cat "$RUNNER_TEMP/server.log" || true

      - name: Stop the server
        if: always()
        run: kill "$(cat "$RUNNER_TEMP/app.pid")" 2>/dev/null || true
