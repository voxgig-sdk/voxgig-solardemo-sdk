[package]
name = "voxgig-voxgig-solardemo-sdk"
version = "0.1.0"
edition = "2021"
description = "Unofficial generated Rust SDK for the Solar System public API. Not affiliated with or endorsed by the upstream API provider."
license = "MIT"

[lib]
name = "voxgig_solardemo_sdk"
path = "lib.rs"

[dependencies]
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
webpki-roots = "0.26"
flate2 = "1"
ureq = "2"

[[test]]
name = "secrets_feature"
path = "tests/feature/secrets/main.rs"
